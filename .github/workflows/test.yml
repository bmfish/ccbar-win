name: Test

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 只装测试真正需要的：pystray / win10toast 是 Windows 独占，Linux 上装不上，
    # 测试里对它们打桩（见 tests/test_charts.py）。
    - name: Install test dependencies
      run: python -m pip install --upgrade pip Pillow

    - name: Run tests
      run: python -m unittest discover -s tests -v
